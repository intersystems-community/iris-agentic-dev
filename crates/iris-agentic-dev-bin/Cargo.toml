[package]
name = "iris-agentic-dev"
version.workspace = true
edition.workspace = true
# Every test file is a module of one of the three aggregate targets below. Without this, cargo would
# also auto-discover each tests/*.rs as its own target and compile the same code twice.
autotests = false
authors.workspace = true
license.workspace = true

[features]
# Carries no code. It exists so this crate's test targets can gate on the same `--features testing`
# flag the core crate's do, which is what CI and every documented test command pass. `testing` is
# already on for the core dependency below unconditionally.
testing = []

[[bin]]
name = "iris-agentic-dev"
path = "src/main.rs"

[lib]
name = "iris_agentic_dev"
path = "src/lib.rs"

[dependencies]
iris-agentic-dev-core = { path = "../iris-agentic-dev-core", features = ["testing"] }
rmcp = { workspace = true }
reqwest = { workspace = true }
clap.workspace = true
which.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
urlencoding = "2"
dirs = "5"
tracing.workspace = true
tracing-subscriber.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower-service = "0.3"

[[example]]
name = "windows_sm_credential"
path = "examples/windows_sm_credential.rs"

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[[test]]
# All 2 files directly under tests/ compile into this one binary. See tests/main.rs.
name = "bin_misc"
path = "tests/main.rs"
required-features = ["testing"]

[[test]]
# All 10 files under tests/unit/ compile into this one binary. See tests/unit/main.rs for why.
name = "bin_unit"
path = "tests/unit/main.rs"
required-features = ["testing"]

[[test]]
# All 14 files under tests/integration/ compile into this one binary. See tests/integration/main.rs for why.
name = "bin_integration"
path = "tests/integration/main.rs"
required-features = ["testing"]
