[package]
name = "iris-agentic-dev-core"
version.workspace = true
edition.workspace = true
# Every test file is a module of one of the five aggregate targets below. Without this, cargo would
# also auto-discover each tests/*.rs as its own target and compile the same code twice.
autotests = false
authors.workspace = true
license.workspace = true

[features]
testing = []
# Compiles in the tests that need the operating system's real keychain, and so a person at the
# machine to answer its approval dialog. `--include-ignored` does not reach them: they are not
# `#[ignore]`d, they are absent without this feature. See CLAUDE.md ("A test that must use the real keychain").
real-keychain-tests = []

[dependencies]
rmcp.workspace = true
tokio.workspace = true
reqwest.workspace = true
bollard.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
semver.workspace = true
anyhow.workspace = true
regex.workspace = true
thiserror.workspace = true
tracing.workspace = true
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
keyring = { version = "4", features = ["v1"] }
keyring-core = { version = "1" }
tree-sitter = "0.26"
tree-sitter-objectscript = "1.10"
tree-sitter-objectscript-routine = "1.10"
quick-xml = "0.41"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "connect", "handshake"], default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.22"
aes-gcm = "0.10"
similar = "2"
# 0.4.0 is the first release with the host `Atelier` interface `tools/check.rs` implements.
ascot = "0.4.0"


# Platform keychain store crates — already in the dep tree via keyring v4.
# Direct deps needed to call Store::new() in init_platform_keystore().
# keyring v4.1.3's v1::Entry::new has a bug (compare_exchange check is inverted)
# so it never calls set_credential_store() — we do it ourselves.

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_WindowsProgramming"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# Test dependencies
[dev-dependencies]
# Runs `testing::isolate_process` before `main` in every test target (spec 141 T183).
ctor = "0.2"
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
serde_json.workspace = true
reqwest.workspace = true
regex.workspace = true
wiremock = "0.6"
toml.workspace = true
# T-R4b-B03: a TLS listener with a certificate made at test time. Already in Cargo.lock through
# hyper-rustls, so no crate is added: the default features would pull in aws-lc-rs, so they are off
# and the `ring` provider the rest of the tree uses is on.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[test]]
# All 15 files directly under tests/ compile into this one binary. See tests/main.rs.
name = "misc"
path = "tests/main.rs"
required-features = ["testing"]

[[test]]
# All 54 files under tests/integration/ compile into this one binary. See tests/integration/main.rs for why.
name = "integration"
path = "tests/integration/main.rs"
required-features = ["testing"]

[[test]]
# All 14 files under tests/binary/ compile into this one binary. See tests/binary/main.rs for why.
name = "binary"
path = "tests/binary/main.rs"
required-features = ["testing"]

[[test]]
# All 99 files under tests/unit/ compile into this one binary. See tests/unit/main.rs for why.
name = "unit"
path = "tests/unit/main.rs"
required-features = ["testing"]

[[test]]
name = "nopws_skill_test"
path = "tests/skills/nopws_skill_test.rs"

