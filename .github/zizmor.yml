# zizmor configuration. Each entry here is a finding that was read and accepted, with the reason.
# An entry is not a way to make the linter quiet: if the reason stops being true, delete the line.
rules:
  cache-poisoning:
    ignore:
      # zizmor treats these as publishing workflows because they run on pushes to release/**.
      # None of them publishes anything: their output is a pass or a fail. The workflow that does
      # publish, release.yml, restores no cache at all, so nothing these jobs write can reach a
      # shipped artifact.
      - ci.yml
      - audit.yml
      - gates.yml
  superfluous-actions:
    ignore:
      # action-gh-release could be `gh release create`, but the upload logic it replaces is not
      # worth re-implementing in bash. It is SHA-pinned like everything else.
      - release.yml
  adhoc-packages:
    ignore:
      # The nightly installs opencode globally with npm. It is pinned to an exact version; it is
      # not in a lockfile because it is a CLI the job runs, not a dependency of anything here.
      - skill-regression.yml
