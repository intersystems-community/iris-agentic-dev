name: Skill Regression

on:
  schedule:
    # Nightly at 02:00 UTC — avoids overlap with daytime CI runs
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Single skill to evaluate (leave blank for all covered skills)'
        required: false
        default: ''
      runs:
        description: 'Runs per skill'
        required: false
        default: '3'
      update_baseline:
        description: 'Update baseline after run'
        required: false
        type: boolean
        default: false

jobs:
  skill-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Install Python dependencies
        run: |
          pip install \
            pyyaml \
            openai \
            litellm \
            pytest \
            anthropic \
            iris-devtester

      - name: Start IRIS community container
        run: |
          # 2026.1 + latest-cd fail post-startup on GHA ("dbapi.connect" wrapper crash).
          # Using 2025.3 — last known-good stable on GHA runners as of 2026-07-17.
          # ISC_DATA_DIRECTORY omitted — /dur/irisdata does not exist on GHA runners
          # and causes IRIS to exit before PWS starts.
          docker run -d --name iris-skill-eval \
            -p 52773:52773 \
            --shm-size 1g \
            --ulimit nofile=65536:65536 \
            intersystemsdc/iris-community:2025.3
          sleep 15
          docker ps -a | grep iris-skill-eval
          echo "=== Early container logs ==="
          docker logs iris-skill-eval 2>&1 | head -40 || true
          echo "Waiting 90s for IRIS to initialise..."
          sleep 75

      - name: Wait for Atelier API
        run: |
          # Only 200 counts as ready. A 401 means the port is answering but auth is
          # refused — usually the first-login password expiry on community images —
          # and treating it as success just defers the failure to fixture load, where
          # it shows up as an unexplained 401 PUT.
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 \
              -u _SYSTEM:SYS "http://localhost:52773/api/atelier/" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "Atelier ready (HTTP 200)"
              exit 0
            fi
            if [ "$status" = "401" ]; then
              echo "  attempt $i/60: HTTP 401 — port up, auth refused; unexpiring password"
              # Community images ship _SYSTEM with an expired password. Clear the
              # expiry so REST auth works; idempotent, so it is safe to retry.
              docker exec iris-skill-eval iris session IRIS -U %SYS \
                '##class(Security.Users).UnExpireUserPasswords("*")' 2>&1 | tail -3 || true
            else
              echo "  attempt $i/60: HTTP $status"
            fi
            sleep 5
          done
          echo "IRIS did not become ready in 7 minutes (last status: $status)"
          docker logs iris-skill-eval 2>&1 | tail -80
          exit 1

      - name: Detect IRIS credentials
        run: |
          for creds in "_SYSTEM:SYS" "SuperUser:SYS" "_SYSTEM:sys" "SuperUser:sys"; do
            user="${creds%%:*}"; pass="${creds##*:}"
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -u "$user:$pass" "http://localhost:52773/api/atelier/" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "IRIS_USERNAME=$user" >> $GITHUB_ENV
              echo "IRIS_PASSWORD=$pass" >> $GITHUB_ENV
              echo "Credentials: $user"
              exit 0
            fi
            echo "  $user: HTTP $status"
          done
          # Do not fall through to a guess. Every candidate failing means the eval
          # cannot authenticate, and pretending otherwise produces a 401 several
          # steps later that looks like a harness bug rather than an auth problem.
          echo "No working credentials for Atelier REST — cannot run the eval."
          docker logs iris-skill-eval 2>&1 | tail -40
          exit 1

      - name: Run unit tests for skill_eval harness
        run: |
          python -m pytest tests/e2e/skill_eval/ \
            --ignore=tests/e2e/skill_eval/test_integration.py \
            --ignore=tests/e2e/skill_eval/test_debug_events.py \
            --ignore=tests/e2e/skill_eval/test_debug_single.py \
            --ignore=tests/e2e/skill_eval/test_debug_vector.py \
            --ignore=tests/e2e/skill_eval/test_tovector_probe.py \
            --ignore=tests/e2e/skill_eval/test_tovector_score.py \
            -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run skill regression suite
        id: eval
        run: |
          SKILL_ARG=""
          if [ -n "${{ github.event.inputs.skill }}" ]; then
            SKILL_ARG="--skill ${{ github.event.inputs.skill }}"
          fi
          RUNS="${{ github.event.inputs.runs || '3' }}"

          python -m tests.e2e.skill_eval \
            $SKILL_ARG \
            --runs "$RUNS" \
            --yes \
            --output tests/e2e/results/ \
            --model "openai/gpt-4.1"
        env:
          PYTHONPATH: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IRIS_HOST: localhost
          IRIS_WEB_PORT: "52773"
          IRIS_USERNAME: ${{ env.IRIS_USERNAME }}
          IRIS_PASSWORD: ${{ env.IRIS_PASSWORD }}
          IRIS_NAMESPACE: USER
          IRIS_CONTAINER: iris-skill-eval

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-eval-results-${{ github.run_id }}
          path: tests/e2e/results/skill-eval-*.json
          retention-days: 90

      - name: Update baseline
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          python -m tests.e2e.skill_eval \
            --yes \
            --update-baseline \
            --output tests/e2e/results/ \
            --model "openai/gpt-4.1"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/results/skill-baseline.json
          git diff --staged --quiet || git commit -m "chore: update skill regression baseline [skip ci]"
          git push
        env:
          PYTHONPATH: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IRIS_HOST: localhost
          IRIS_WEB_PORT: "52773"
          IRIS_USERNAME: ${{ env.IRIS_USERNAME }}
          IRIS_PASSWORD: ${{ env.IRIS_PASSWORD }}
          IRIS_NAMESPACE: USER
          IRIS_CONTAINER: iris-skill-eval
