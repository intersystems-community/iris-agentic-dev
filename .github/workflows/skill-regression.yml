name: Skill Regression

# One job, three tasks, no lift.
#
# What this used to be: nine shards of five opencode sessions each, ~$3.70 and about two hours of
# runner time a night, to publish a per-skill lift the corpus could not support. Six of nine skills
# printed 0.00 against 0.00 and the job reported success. Then runs 34744344877, 34817991701 and
# 34939912456 failed three nights in a row on Δs smaller than the harness's own resolution — the
# regression threshold sat at 0.05 and the MDE at eight task-pairs is 0.35.
#
# 121 FR-016 changes the question rather than the threshold. The nightly asks three things with
# cheap answers: does the harness still run, does the binary still advertise its tools, and does a
# named canary set still pass. The canary set is assertion-scored — `tool_called`, `skill_invoked`,
# and a two-tool chain — so a night needs three agent sessions, no judge, and no scorer credential.
# Lift belongs to the full benchmark, which runs at a release and before a conference over a corpus
# large enough to support it.

on:
  schedule:
    # Nightly at 02:00 UTC — avoids overlap with daytime CI runs
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    # Three sessions is about a minute of agent time. The rest is setup: npm, the binary
    # download, and the IRIS container's ~90 s start plus the Atelier wait. 30 covers a slow
    # runner and a cold npm cache without letting a wedged session hold a runner for hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Install Python dependencies
        run: |
          pip install \
            pyyaml \
            openai \
            litellm \
            pytest \
            'anthropic[bedrock]' \
            iris-devtester
          # The routing loop's pinned gepa. Without it the adapter tests skip; IAD_REQUIRE_GEPA
          # below turns that skip into a failure.
          pip install -r tests/e2e/skill_eval/optimize/requirements.txt

      - name: Run unit tests for skill_eval harness
        # The cheapest breakage signal in the whole night, and it starts no session. If the
        # harness cannot import its own modules there is no point starting a container.
        #
        # The --ignore list is no longer what keeps this step from spending money: every spawn point
        # refuses unless IAD_BILLABLE_SESSIONS=1, and the tests that spawn carry a `billable` marker
        # that skips them without it (tests/e2e/billing.py). Kept because skipping six files is
        # faster than collecting them, not because it is load-bearing.
        #
        # `-m "not requires_iris"` is the same filter ci.yml applies: this job has no IRIS container,
        # so a test that needs one is not a failure here. Without it `test_provenance` went red on
        # 2026-10-06 and the canary stayed red until it was found.
        run: |
          python -m pytest tests/e2e/skill_eval/ \
            -m "not requires_iris" \
            --ignore=tests/e2e/skill_eval/test_integration.py \
            --ignore=tests/e2e/skill_eval/test_debug_events.py \
            --ignore=tests/e2e/skill_eval/test_debug_single.py \
            --ignore=tests/e2e/skill_eval/test_debug_vector.py \
            --ignore=tests/e2e/skill_eval/test_tovector_probe.py \
            --ignore=tests/e2e/skill_eval/test_tovector_score.py \
            -q
        env:
          PYTHONPATH: ${{ github.workspace }}
          IAD_REQUIRE_GEPA: "1"

      - name: Routing drift
        # 128 FR-012: re-score the shipped skill descriptions on the frozen routing holdout with
        # the Haiku proxy, and fail when Recall@1 leaves the band committed in
        # tests/e2e/tasks/routing/drift-interval.json. About 80 scorer calls, under $0.50, capped
        # at $2 by the ledger. No optimiser runs here; `optimize run` is a manual job.
        run: python -m tests.e2e.skill_eval.optimize drift --budget 2
        env:
          PYTHONPATH: ${{ github.workspace }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: us-east-1

      - name: Install the released iris-agentic-dev binary
        # The canary's second question is answered by asking this binary what it advertises,
        # and `probe_tool_surface` reads IAD_BINARY to find it. Without the export the surface
        # reads as None, which the report counts as breakage rather than as 81 tools.
        #
        # This is also the bug the whole check exists for: the nightly ran for weeks with no iad
        # tools in any session because `isolated_env.py` held a literal Homebrew path that no
        # runner has. Every transcript was a bare model and the judge scored it as the skill
        # failing.
        run: |
          mkdir -p "$RUNNER_TEMP/iad"
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern iris-agentic-dev-linux-x86_64 --dir "$RUNNER_TEMP/iad"
          mv "$RUNNER_TEMP/iad/iris-agentic-dev-linux-x86_64" "$RUNNER_TEMP/iad/iris-agentic-dev"
          chmod +x "$RUNNER_TEMP/iad/iris-agentic-dev"
          echo "IAD_BINARY=$RUNNER_TEMP/iad/iris-agentic-dev" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Start IRIS community container
        run: |
          # 2026.1 + latest-cd fail post-startup on GHA ("dbapi.connect" wrapper crash).
          # Using 2025.3 — last known-good stable on GHA runners as of 2026-07-17.
          # ISC_DATA_DIRECTORY omitted — /dur/irisdata does not exist on GHA runners
          # and causes IRIS to exit before PWS starts.
          docker run -d --name iris-skill-eval \
            -p 52773:52773 \
            --shm-size 1g \
            --ulimit nofile=65536:65536 \
            intersystemsdc/iris-community:2025.3
          sleep 15
          docker ps -a | grep iris-skill-eval
          echo "--- Early container logs ---"
          docker logs iris-skill-eval 2>&1 | head -40 || true
          echo "Waiting 90s for IRIS to initialise..."
          sleep 75

      - name: Wait for Atelier API
        run: |
          # Only 200 counts as ready. A 401 means the port is answering but auth is
          # refused — usually the first-login password expiry on community images —
          # and treating it as success just defers the failure to fixture load, where
          # it shows up as an unexplained 401 PUT.
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 \
              -u _SYSTEM:SYS "http://localhost:52773/api/atelier/" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "Atelier ready (HTTP 200)"
              exit 0
            fi
            if [ "$status" = "401" ]; then
              echo "  attempt $i/60: HTTP 401 — port up, auth refused; unexpiring password"
              # Community images ship _SYSTEM with an expired password. Clear the
              # expiry so REST auth works; idempotent, so it is safe to retry.
              docker exec iris-skill-eval iris session IRIS -U %SYS \
                '##class(Security.Users).UnExpireUserPasswords("*")' 2>&1 | tail -3 || true
            else
              echo "  attempt $i/60: HTTP $status"
            fi
            sleep 5
          done
          echo "IRIS did not become ready in 7 minutes (last status: $status)"
          docker logs iris-skill-eval 2>&1 | tail -80
          exit 1

      - name: Detect IRIS credentials
        run: |
          for creds in "_SYSTEM:SYS" "SuperUser:SYS" "_SYSTEM:sys" "SuperUser:sys"; do
            user="${creds%%:*}"; pass="${creds##*:}"
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -u "$user:$pass" "http://localhost:52773/api/atelier/" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "IRIS_USERNAME=$user" >> $GITHUB_ENV
              echo "IRIS_PASSWORD=$pass" >> $GITHUB_ENV
              echo "Credentials: $user"
              exit 0
            fi
            echo "  $user: HTTP $status"
          done
          # Do not fall through to a guess. Every candidate failing means the canary
          # cannot authenticate, and pretending otherwise produces a 401 several
          # steps later that looks like a harness bug rather than an auth problem.
          echo "No working credentials for Atelier REST — cannot run the canary."
          docker logs iris-skill-eval 2>&1 | tail -40
          exit 1

      - name: Nightly canary
        # Exit 0 healthy, 1 broken and named, 2 misconfigured — 2 means no session started, so
        # nothing was spent. The canary set lives in `nightly_canary.CANARY_TASKS`; naming the
        # tasks here as well would give the night two lists that can disagree.
        run: |
          python -m tests.e2e.skill_eval.nightly_canary \
            --output tests/e2e/results/
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Runs the three agent sessions. All three canary tasks declare a Bedrock model in
          # their own YAML and `run_task` lets that override CANARY_MODEL, so the Bedrock token
          # is the one that matters here — `missing_credentials()` checks per task and exits 2
          # if the key present is not one any canary session can authenticate with.
          #
          # No scorer key of any kind: the canary set is assertion-scored, which is why a night
          # now costs three sessions and no grading call.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # Literal, not a secret: the region is not sensitive, and a blank one silently sent
          # every call to the SDK's us-east-1 default.
          AWS_REGION: us-east-1
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CANARY_MODEL: "openai/gpt-4.1"
          IAD_BINARY: ${{ env.IAD_BINARY }}
          IRIS_HOST: localhost
          IRIS_WEB_PORT: "52773"
          IRIS_USERNAME: ${{ env.IRIS_USERNAME }}
          IRIS_PASSWORD: ${{ env.IRIS_PASSWORD }}
          IRIS_NAMESPACE: USER
          IRIS_CONTAINER: iris-skill-eval

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-canary-${{ github.run_id }}
          # Named for the report, not a glob over the whole results directory: the old
          # `skill-eval-*.json` glob carried 35 tracked files from May and June into all nine
          # shard artifacts, and the merge read 324 files to find nine.
          path: tests/e2e/results/nightly-canary-*.json
          retention-days: 90
