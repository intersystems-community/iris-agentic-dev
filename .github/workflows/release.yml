name: Release

on:
  push:
    # Binary releases only. 'v*' also matched 'vscode-v0.4.24', which cut a
    # full binary + Docker + Homebrew release from an extension-only version
    # bump, publishing binaries under a tag in neither version sequence.
    # Glob, not regex: [0-9] is a character class but + is literal.
    tags: ["v[0-9]*"]

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more. The jobs that publish name the one scope they need, so a
# dependency's build script or an npm lifecycle script running in any other job holds a token that
# cannot write to the repository, the release, or the package registry.
permissions:
  contents: read

jobs:
  # Every other job needs this one, so nothing is built or published from a tag that fails it.
  # Tag protection (a ruleset on refs/tags/v*) decides who may push a tag; this decides which
  # commits a tag may point at: one that is already on master, carrying the version it claims.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so origin/master is there to compare against.
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on master and names the workspace version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master. Merge first, then tag (docs/release-checklist.md, steps 6 and 7)."
            exit 1
          fi
          declared=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$declared" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Cargo.toml declares $declared but the tag is $GITHUB_REF_NAME."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on master and matches Cargo.toml"

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: iris-agentic-dev-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: iris-agentic-dev-linux-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: iris-agentic-dev-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: iris-agentic-dev-macos-x86_64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            artifact: iris-agentic-dev-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          targets: ${{ matrix.target }}
      # No rust-cache here. A release build restores nothing it did not compile itself: a cache
      # entry is written by whichever earlier run had the same key, and the shipped binary should
      # not depend on what that run left in target/. A tag build is rare enough to pay full price.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          use-cache: false
      # Exact version and --locked: this tool links every shipped binary, so it must not be
      # whatever crates.io resolved on the morning of the release.
      - run: cargo install cargo-zigbuild --locked --version 0.24.0
      # --locked is load-bearing, not hygiene. Cargo reconciles a stale lockfile during
      # resolution, which happens before build.rs runs `git describe --dirty` — so drift
      # made every published 1.2.6 asset advertise `1.2.6+v1.2.6-dirty`. Failing here is
      # the point: a release must not silently build from a different dependency graph
      # than the one committed.
      - run: cargo zigbuild --locked --release --target "$TARGET" -p iris-agentic-dev
        env:
          TARGET: ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          src="target/${TARGET}/release/iris-agentic-dev"
          [[ -f "${src}.exe" ]] && src="${src}.exe"
          cp "$src" "$ARTIFACT"
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
      - name: Ad-hoc codesign (macOS only — removes Gatekeeper quarantine hang)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "$ARTIFACT"
        env:
          ARTIFACT: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-vsix:
    # After the binaries: the extension pins each binary's SHA-256 and checks
    # its download against it, so the hashes must exist before the VSIX is
    # packaged. The bytes hashed here are the bytes the release job publishes.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No cache in a release: a cache entry is whatever an earlier run with the same key left.
          package-manager-cache: false
      - name: Check the extension ships this release's binary version
        run: |
          # The extension downloads irisAgenticDev.serverVersion from the
          # release tagged v<that version>. If it does not match the tag being
          # released, every auto-install 404s. Checked before the build so a
          # mismatch fails in seconds rather than after npm ci and packaging.
          declared=$(node -p "require('./vscode-iris-agentic-dev/package.json').irisAgenticDev.serverVersion")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "::error::vscode-iris-agentic-dev/package.json declares serverVersion=$declared but this release is $tag."
            echo "Bump irisAgenticDev.serverVersion to $tag so auto-install resolves."
            exit 1
          fi
          echo "serverVersion $declared matches tag $tag"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
          pattern: "iris-agentic-dev-*"
      - name: Pin the binaries' SHA-256 in the extension
        # Fails if any of the five assets is missing or empty. Without a pin
        # for its platform the extension installs nothing, so a VSIX packaged
        # without this step could never auto-install.
        run: node vscode-iris-agentic-dev/scripts/stamp-asset-hashes.cjs release-assets vscode-iris-agentic-dev/package.json
      # --ignore-scripts: no dependency's install hook runs in the job that produces the .vsix.
      # The build needs none of them — esbuild ships its platform binary as an optional package.
      - run: cd vscode-iris-agentic-dev && npm ci --ignore-scripts && npm test && npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: vscode-iris-agentic-dev/vscode-iris-agentic-dev-*.vsix

  sbom:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate the SBOM
        # The tag name goes through the environment, not `${{ }}`: an expression is pasted into
        # the script before bash parses it, and a tag can carry `$(…)`.
        run: |
          cargo cyclonedx --format json --override-filename sbom
          cp crates/iris-agentic-dev-bin/sbom.json "iris-agentic-dev-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: iris-agentic-dev-*.cdx.json

  release:
    needs: [build, build-vsix, docker-publish, sbom]
    runs-on: ubuntu-latest
    # A maintainer approves each job that publishes (Settings > Environments > release), and the
    # publishing secrets live in this environment rather than in the repository.
    environment: release
    permissions:
      contents: write
      # Both for signing: id-token gets the job a short-lived Sigstore certificate naming this
      # workflow and tag, attestations stores the provenance next to the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: "{iris-agentic-dev-*,vsix,sbom}"
      - name: Write release body
        # The tag reaches the body through @VERSION@ and bash, not `${{ github.ref_name }}` in the
        # heredoc: an expression is pasted into the script before bash reads it. The version has no
        # leading `v` because that is the tag metadata-action's semver pattern pushes to GHCR.
        run: |
          cat > release-body.md << 'EOF'
          The VS Code extension auto-installs the binary on first activation — no separate install needed. Install from the [Marketplace](https://marketplace.visualstudio.com/items?itemName=intersystems-community.vscode-iris-agentic-dev) and go.

          **Windows:** The binary downloads correctly but is unsigned, so SmartScreen may block it from running. If that happens, you may be able to work around it using the Docker image — `ghcr.io/intersystems-community/iris-agentic-dev:@VERSION@` — see [docs/windows-docker.md](https://github.com/intersystems-community/iris-agentic-dev/blob/master/docs/windows-docker.md).

          > The `.vsix` below is a fallback for air-gapped or pinned-version installs. Homebrew and manual binary install still work as before.
          EOF
          body=$(cat release-body.md)
          printf '%s\n' "${body//@VERSION@/${GITHUB_REF_NAME#v}}" > release-body.md
      - name: Check the VSIX pins match the assets being published
        # The VSIX was packaged from the same artifacts, but a pin that
        # disagrees with a published asset would make every auto-install fail
        # its hash check, so compare before anything is released.
        run: |
          unzip -p vscode-iris-agentic-dev-*.vsix extension/package.json > vsix-package.json
          for f in iris-agentic-dev-linux-x86_64 iris-agentic-dev-linux-aarch64 \
                   iris-agentic-dev-macos-arm64 iris-agentic-dev-macos-x86_64 \
                   iris-agentic-dev-windows-x86_64.exe; do
            pinned=$(node -p "require('./vsix-package.json').irisAgenticDev.assetSha256['$f']")
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$pinned" != "$actual" ]; then
              echo "::error::VSIX pins $pinned for $f but the asset hashes to $actual"
              exit 1
            fi
          done
          rm vsix-package.json
      - name: Write SHA256SUMS
        run: |
          sha256sum iris-agentic-dev-linux-x86_64 iris-agentic-dev-linux-aarch64 \
            iris-agentic-dev-macos-arm64 iris-agentic-dev-macos-x86_64 \
            iris-agentic-dev-windows-x86_64.exe > SHA256SUMS
          cat SHA256SUMS
      # Build provenance for every published file: a signed statement that this workflow, at this
      # commit, produced exactly these bytes. `gh attestation verify` checks it
      # (docs/verifying-releases.md). Before this, SHA256SUMS sat beside the files it described, so
      # whoever could replace a binary could replace its checksum too.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            iris-agentic-dev-linux-x86_64
            iris-agentic-dev-linux-aarch64
            iris-agentic-dev-macos-arm64
            iris-agentic-dev-macos-x86_64
            iris-agentic-dev-windows-x86_64.exe
            vscode-iris-agentic-dev-*.vsix
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            iris-agentic-dev-linux-x86_64
            iris-agentic-dev-linux-aarch64
            iris-agentic-dev-macos-arm64
            iris-agentic-dev-macos-x86_64
            iris-agentic-dev-windows-x86_64.exe
          sbom-path: iris-agentic-dev-${{ github.ref_name }}.cdx.json
      # A keyless signature over SHA256SUMS, for anyone who checks with cosign rather than gh.
      # The bundle holds the signature and the certificate, which names this workflow file and
      # the tag; `cosign verify-blob` checks both.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      # Created as a draft, published once every asset is uploaded. Immutable releases forbid
      # adding assets to a published release, and action-gh-release creates the release before it
      # uploads; a draft is the one state where both work.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            iris-agentic-dev-linux-x86_64
            iris-agentic-dev-linux-aarch64
            iris-agentic-dev-macos-arm64
            iris-agentic-dev-macos-x86_64
            iris-agentic-dev-windows-x86_64.exe
            vscode-iris-agentic-dev-*.vsix
            iris-agentic-dev-*.cdx.json
            SHA256SUMS
            SHA256SUMS.sigstore.json
          generate_release_notes: true
          body_path: release-body.md
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  publish-marketplace:
    # Must come after `release`, not alongside it. vsce publish is
    # irreversible — a version, once accepted, can never be re-pushed, and
    # installed clients auto-update within hours. The extension it publishes
    # downloads binaries from the release this workflow is still creating, so
    # publishing in parallel ships an extension that 404s for the length of
    # the gap. rust-analyzer and vscode-objectscript both order it this way.
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      # The checkout is for the lockfile. Without it, `npx vsce` found no local install and
      # fetched the `vsce` package from npm at publish time — the deprecated 2.x line, at
      # whatever version was current, running with VSCE_PAT in its environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No cache in a release: a cache entry is whatever an earlier run with the same key left.
          package-manager-cache: false
      - run: cd vscode-iris-agentic-dev && npm ci --ignore-scripts
      - name: Publish to VS Code Marketplace
        # Not allowed to sink the release, which has already succeeded by now.
        # The most common failure is "version already published" — the
        # extension ships on its own cadence, so a binary release often carries
        # an unchanged extension version. The .vsix is attached to the release
        # either way.
        continue-on-error: true
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set — skipping Marketplace publish."
            exit 0
          fi
          # Publish the exact .vsix that was built and attached to the release,
          # rather than rebuilding one that could differ.
          vsix=$(find "$PWD" -maxdepth 1 -name 'vscode-iris-agentic-dev-*.vsix' | head -1)
          echo "Publishing $vsix"
          # --no-install: the lockfile's @vscode/vsce or nothing. The token is not passed as
          # --pat, which would put it in the process table; vsce reads VSCE_PAT itself.
          cd vscode-iris-agentic-dev && npx --no-install vsce publish --packagePath "$vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  docker-publish:
    needs: build
    runs-on: ubuntu-latest
    # Pushes `latest`, so it waits for the same approval as the GitHub release.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: "iris-agentic-dev-linux-*"
      - name: Stage binaries for multi-arch Docker build
        run: |
          mkdir -p bin
          cp iris-agentic-dev-linux-x86_64 bin/iris-agentic-dev-amd64
          cp iris-agentic-dev-linux-aarch64 bin/iris-agentic-dev-arm64
          chmod +x bin/iris-agentic-dev-amd64 bin/iris-agentic-dev-arm64
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/intersystems-community/iris-agentic-dev
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # BuildKit's own records, stored with the image: the full build provenance and an SBOM
          # of the image contents.
          provenance: mode=max
          sbom: true
      # GitHub's provenance for the image index, pushed to GHCR beside it, so
      # `gh attestation verify oci://ghcr.io/...` works the same way it does for the binaries.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/intersystems-community/iris-agentic-dev
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signed by digest, never by tag: a tag can be moved after signing, a digest cannot.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/intersystems-community/iris-agentic-dev@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  update-homebrew-tap:
    # Writes the Formula to the tap repository only. It used to commit the same file to master
    # here as well, which needed a token that can push to master; the tap is what `brew` reads.
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: "iris-agentic-dev-*"
      - name: Compute SHA256s and update Formula/iris-agentic-dev.rb
        run: |
          ARM64=$(shasum -a 256 iris-agentic-dev-macos-arm64 | awk '{print $1}')
          X86_64=$(shasum -a 256 iris-agentic-dev-macos-x86_64 | awk '{print $1}')
          LINUX=$(shasum -a 256 iris-agentic-dev-linux-x86_64 | awk '{print $1}')
          LINUX_ARM64=$(shasum -a 256 iris-agentic-dev-linux-aarch64 | awk '{print $1}')
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" "$ARM64" "$X86_64" "$LINUX" "$LINUX_ARM64" << 'PYEOF'
          import sys, textwrap
          v, a64, x86, lnx, lnx_arm = sys.argv[1:]
          rb = textwrap.dedent(f"""\
            class IrisAgenticDev < Formula
              desc "MCP server connecting AI assistants to InterSystems IRIS — compile, test, debug ObjectScript without leaving the chat"
              homepage "https://github.com/intersystems-community/iris-agentic-dev"
              version "{v}"
              license "MIT"

              on_macos do
                on_arm do
                  url "https://github.com/intersystems-community/iris-agentic-dev/releases/download/v{v}/iris-agentic-dev-macos-arm64"
                  sha256 "{a64}"
                end
                on_intel do
                  url "https://github.com/intersystems-community/iris-agentic-dev/releases/download/v{v}/iris-agentic-dev-macos-x86_64"
                  sha256 "{x86}"
                end
              end

              on_linux do
                on_arm do
                  url "https://github.com/intersystems-community/iris-agentic-dev/releases/download/v{v}/iris-agentic-dev-linux-aarch64"
                  sha256 "{lnx_arm}"
                end
                on_intel do
                  url "https://github.com/intersystems-community/iris-agentic-dev/releases/download/v{v}/iris-agentic-dev-linux-x86_64"
                  sha256 "{lnx}"
                end
              end

              def install
                bin_name = "iris-agentic-dev-macos-arm64"
                bin_name = "iris-agentic-dev-macos-x86_64" if Hardware::CPU.intel? && OS.mac?
                bin_name = "iris-agentic-dev-linux-aarch64" if OS.linux? && Hardware::CPU.arm?
                bin_name = "iris-agentic-dev-linux-x86_64" if OS.linux? && Hardware::CPU.intel?
                bin.install bin_name => "iris-agentic-dev"
              end

              test do
                assert_match "iris-agentic-dev #{{version}}", shell_output("#{{bin}}/iris-agentic-dev --version")
              end
            end
          """)
          with open("Formula/iris-agentic-dev.rb", "w") as f:
            f.write(rb)
          PYEOF
      - name: Push formula to homebrew-tap repo
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAP_SHA=$(gh api repos/intersystems-community/homebrew-tap/contents/Formula/iris-agentic-dev.rb --jq '.sha')
          CONTENT=$(base64 < Formula/iris-agentic-dev.rb)
          gh api --method PUT \
            repos/intersystems-community/homebrew-tap/contents/Formula/iris-agentic-dev.rb \
            -f message="chore: bump iris-agentic-dev to v${VERSION}" \
            -f content="${CONTENT}" \
            -f sha="${TAP_SHA}"
