name: Dependency audit

# Scans the locked dependencies against the RustSec advisory database and the npm advisory database.
# It runs on every pull request and on master, and every Monday: an advisory can be published against a
# crate that has not changed, so a scan that only runs on a push would miss it.
on:
  pull_request:
  push:
    branches: [master, "fix/**", "release/**"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # Installed from its own lockfile so the scanner is not itself a moving target.
      - run: cargo install cargo-audit --locked
      # Fails the job on a vulnerability. Unmaintained or yanked crates are printed as warnings and do
      # not fail it; they are read in the job log.
      - run: cargo audit

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: cd vscode-iris-agentic-dev && npm ci --ignore-scripts
      # The extension ships its production dependencies; dev tooling is not in the package.
      - run: cd vscode-iris-agentic-dev && npm audit --omit=dev --audit-level=high
