[profile.dev]
debug = true          # full debug info — required for stepping in VS Code / lldb

# Test binaries only. This was added while chasing the 207-`[[test]]`-target spawn cost and does not
# address it — aggregating the test files into five targets per crate did (see
# crates/iris-agentic-dev-core/tests/unit/main.rs). It stays for what it does do: full DWARF copied
# into every test binary made target/debug/deps 26 GB and made each link slower.
# `debug = 1` keeps line tables, so panic backtraces still name a file and line. Stepping in a
# debugger is what `debug = 2` buys, and that is not what test binaries are for.
[profile.test]
debug = 1
split-debuginfo = "unpacked"   # leave DWARF in the .o files instead of copying it into each binary

[profile.dev-fast]
inherits = "dev"
opt-level = 1         # faster compile, still debuggable

[workspace]
members = [
    "crates/iris-agentic-dev-core",
    "crates/iris-agentic-dev-bin",
]
resolver = "2"

[workspace.package]
version = "1.4.0"
edition = "2021"
authors = ["Thomas Dyar <thomas.dyar@intersystems.com>"]
license = "MIT"
repository = "https://github.com/intersystems-community/iris-agentic-dev"

[workspace.dependencies]
# MCP server
rmcp = { version = "3.1.3", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
# CLI
clap = { version = "4", features = ["derive", "env"] }
which = "6"
# Async runtime
tokio = { version = "1", features = ["full"] }
# IRIS HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
# Docker discovery
bollard = "0.21"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.8"
# Semver for manifest
semver = { version = "1", features = ["serde"] }
# Error handling + logging
anyhow = "1"
regex = "1"
tempfile = "3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
