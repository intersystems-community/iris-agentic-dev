# Per-file coverage floors for iris-agentic-dev-core.
#
# Every .rs file under crates/iris-agentic-dev-core/src/ that has executable
# lines MUST have an entry here. Adding code to a file without maintaining its
# floor fails CI. Adding a new file without an entry also fails CI.
#
# Floors are set 2pp below the measured unit-test baseline (2026-07-30).
# "Unit-test" means: --lib --test '*' --features testing, no live IRIS.
#
# Files in the tools/ dispatch layer have low floors because their code is
# only fully exercised via the MCP subprocess — see the coverage archaeology
# in specs/071-execute-session/tasks.md (T028) for details.
# The subprocess profraw merge is tracked as a future project.
#
# To raise a floor after adding tests: measure, verify it passes, update here.
# To register a new file: run scripts/check-coverage-floors.sh to see its
# measured %, then add an entry at (measured - 2).
#
# Measurement command (no IRIS needed):
#   PATH="$HOME/.cargo/bin:$PATH" cargo llvm-cov \
#     --features testing --no-fail-fast -p iris-agentic-dev-core \
#     --lib --test '*' --summary-only -- --test-threads=1

