# Per-file coverage floors for iris-agentic-dev-core.
#
# Every .rs file under crates/iris-agentic-dev-core/src/ that has executable
# lines MUST have an entry here. Adding code to a file without maintaining its
# floor fails CI. Adding a new file without an entry also fails CI.
#
# Two measurement modes:
#
#   Unit-only (fast, offline) — what CI enforces on every push:
#     PATH="$HOME/.cargo/bin:$PATH" cargo llvm-cov \
#       --features testing --no-fail-fast -p iris-agentic-dev-core \
#       --lib --test '*' --summary-only -- --test-threads=1
#     Then: bash scripts/check-coverage-floors.sh
#
#   Merged/subprocess (full picture, requires live IRIS) — release gate:
#     IRIS_HOST=localhost IRIS_WEB_PORT=52780 bash scripts/coverage.sh
#     Merges profraw from spawned iris-agentic-dev subprocesses; dispatch-layer
#     files (mod.rs, observability.rs, etc.) are properly counted here.
#     Enforces the `overall` floor in addition to per-file floors.
#
# Per-file floors = unit-only baseline minus 2pp.
# `overall` = merged/subprocess baseline minus 2pp (enforced only by coverage.sh).
#
# To raise a floor: measure, verify it passes, update here.
# To register a new file: run check-coverage-floors.sh to find measured %,
# then add an entry at (measured - 2).

[floors]
# Overall line coverage floor — enforced only in merged/subprocess mode (src/ files only).
# Baseline: 88.48% (2026-08-08, master, subprocess profraw merge, ws_session bugfix).
# Target: reach 90% once admin_tools/comparison_tools/xdata_flow dispatch gaps are closed.
