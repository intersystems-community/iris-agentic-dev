# The committed train/holdout split for the whole graded corpus — spec 120 FR-011, spec 121 T032.
#
# This is the file the publish path reads. `pilot/split.toml` beside it is the record of what the
# go/no-go was measured under, and `test_split.py` compares the two, so a pilot task cannot change
# sides here without a visible failure.
#
# Every task ID in `pilot/`, `corpus/` and `skills/` appears in exactly one side, and
# `tests/e2e/skill_eval/split.py` refuses to load this file otherwise.
#
# How the line is drawn:
#
# - **Three pilot IDs are train because I have read them.** Every spec 120 phase gate ran PILOT-01 and
#   I read its transcripts; PILOT-02 and PILOT-03 join it so the optimizer has more than one task to
#   fit against. That is tuning, whatever it was called at the time.
# - **Six corpus IDs are train by a stated rule, not by taste: every seventh in authoring order.**
#   CORPUS-07, -14, -21, -28, -35, -42. GEPA needs somewhere to go that is not the holdout, and a
#   train side of three tasks is not somewhere. Fixing the rule before the first figure is taken is
#   the only moment it costs nothing; picking six favourable IDs after a run would be worthless. The
#   six land on try/catch, $Increment, %ListOfDataTypes, the %OpenId guard, VALUELIST and $ZStrip, so
#   the train side is not all one kind of task.
# - **Everything else is holdout — 41 tasks against FR-008's floor of 37.** New tasks default to this
#   side. A task moves to train the moment anyone tunes anything while looking at it, and that move is
#   a commit with a reason.
# - **The skills tasks are all holdout.** They were written for one question and nothing is fitted to
#   them; `test_every_skill_ladder_task_is_on_the_holdout_side` keeps it that way.
# - **SKILL-13 moved to train in 130 round 3.** The ladder flagged `iris-query-plans` on it, and I
#   rewrote the skill's `%NOINDEX` section while reading its transcripts. SKILL-20 replaces it on the
#   holdout for the same skill (`TUNED_SKILL_TASKS` in `test_split.py`).
# - **SKILL-21 is train from the day it was written, in 130 round 4.** It exists so the
#   `objectscript-sql-patterns` fix has a task to be fitted to; SKILL-09 stays on the holdout for the
#   same skill and says whether the fix generalises.
# - **SKILL-22 and SKILL-23 are train from the day they were written, in 132.** They are the
#   `iris-ai-hub` tasks a skill edit may be fitted to (`--side train`); SKILL-24 and SKILL-25 stay on
#   the holdout for the same skill. All four run on iad-aihub-iris (build 139) in USER.
#
# - **135 moved seven skill tasks to train, from `tests/e2e/tasks/skills/read.toml`.** SKILL-02, -03
#   and -05 (the guardrails edit b854b2c, IMP-0006 to IMP-0008), SKILL-09 and SKILL-16 (130 rounds 3
#   and 4 read their transcripts), SKILL-24 and SKILL-25 (132 and IMP-0009/IMP-0010). A task someone
#   read to decide an edit cannot give a held-out figure, and `improve skills` leaves it out. The
#   skills they measure need fresh held-out tasks (specs/135-skill-evidence).
#
# - **SKILL-26 to SKILL-29 are holdout from the day they were written (135, 2026-10-11).** They are
#   `objectscript-guardrails` tasks under `tests/e2e/tasks/skills/objectscript-guardrails/`: a delete
#   callback that takes an OID, an admin task that SQL writes cannot do, an empty `$LIST`, and a nested
#   transaction. Each fact is in the skill text and each check was run live: false against the stub,
#   true against the reference, false against the wrong-answer variant named in its commit.
#
# - **SKILL-30 to SKILL-36 are holdout from the day they were written (135, 2026-10-11).** SKILL-30 to
#   SKILL-32 measure `objectscript-sql-patterns` (an INTO variable after a miss, a NULL-or-future date
#   filter, `$ZDATETIME` in an INSERT); SKILL-33 to SKILL-36 measure `iris-query-plans` (a repair
#   after a bulk load that skipped indexes, `INSERT %NOINDEX` from embedded SQL, a staleness check by
#   `%NOINDEX`, `CREATE INDEX` on a table that already holds rows). Each check was run live on a
#   scratch IRIS 2026.2: false against the stub, true against the reference.
#
# - **SKILL-37 to SKILL-44 are holdout from the day they were written (135, 2026-10-11).** SKILL-37 to
#   SKILL-40 measure `objectscript-tdd` (a class that compiles clean and fails when called: a typo'd
#   local twice, a misspelled dynamic method name, `Quit` with a value inside `For`); SKILL-41 to
#   SKILL-44 measure `iris-agentic-dev` (loading an XML export: two classes, a one-line export, a
#   parameter, a replaced base class). Each check was run live on a scratch IRIS 2026.2.
#
# - **SKILL-45 to SKILL-47 are holdout from the day they were written (135, 2026-10-11).** They measure
#   `objectscript-list-patterns`: de-duplicating a list that holds an empty element (the skill's own
#   `seen(item)` pattern raises on it), removing items from a `%ListOfDataTypes` in place, and
#   reversing a list with no elements.
#
# - **SKILL-48 to SKILL-51 are holdout from the day they were written (135, 2026-10-11).** They measure
#   `iris-sql`: a column named with a reserved word, a prefix search whose prefix holds `_` or `%`,
#   the row count of a bulk UPDATE, and an upsert on a unique key. SKILL-11 (DDL) is the fifth.
#
# - **SKILL-52 to SKILL-61 are holdout from the day they were written (135, 2026-10-12).** SKILL-52 to
#   SKILL-56 measure `objectscript-unit-test` (a test class named by the skill's convention, `Test*` name
#   and `%UnitTest.TestCase` rules, scaffold placeholders); SKILL-57 to SKILL-61 measure
#   `ensemble-production` (an up-check that is not `GetActiveProductionName`, a hot disable of one host, the
#   five production states, adapter against host settings, driving a service with `CreateBusinessService`).
#   The ensemble tasks need `%EnsembleMgr.EnableNamespace("BENCHMARK",1)` on the container first.
#
# - **SKILL-67 to SKILL-69 are holdout from the day they were written (136, 2026-10-17).** They measure
#   whether `ensemble-production` gets agents to write what the Portal's editors open: SKILL-67 rewrites a
#   code-based process and its rules as BPL and a rule class with the behaviour kept (a lookalike of
#   grievance-demo's IntakeBP), SKILL-68 a DTL, SKILL-69 a routing rule. A correctness check with no
#   net-positive claim (136 Q4).
#
# - **SKILL-62 to SKILL-66 are holdout from the day they were written (135, 2026-10-12).** They measure
#   `iris-ai-hub` on iad-aihub-iris (build 154), which lost its holdout when SKILL-24 and SKILL-25 were read:
#   a one-entry XData policy that loads empty, `%CanExecute`'s bare-name argument, the `StreamChat` callback
#   class, a ToolSet query's parameters and `MaxRows`, and `AddDocument` with and without a `source`. None
#   makes an LLM call.
#
# - **CORPUS-43 to CORPUS-57 are holdout from the day they were written (2026-10-29).** Each plants
#   a defect the IRIS compiler accepts and the program trips on at runtime, drawn from the
#   runtime-proven tests of `objectscript-typecheck-corpus`; CORPUS-57, a misspelled macro the
#   compiler also catches, was asked for in the PR review. Written to measure `iris_check` (PR #166);
#   none involves a routine.
#
# One caveat that the split cannot fix and the report has to carry instead: I wrote the 42 corpus
# tasks knowing what iad's 81 tools can do. Authoring is not tuning — no description, prompt or skill
# was changed while looking at a result from these tasks — but a corpus written by the tool author is
# not the same evidence as a corpus written by someone else, and the published number says so.

