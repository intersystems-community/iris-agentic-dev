# Which of the 81 tools a corpus task could plausibly have used — 121 FR-012.
#
# A reach rate needs a denominator, and "all 41 tasks" is the wrong one: `iris_mirror_status` reaching
# none of them says nothing about the tool when none of them is about mirroring. So each tool declares
# one domain, each task declares the domains it touches, and reach is counted over the tasks whose
# domains include the tool's.
#
# This file is committed before the join runs, for the same reason `split.toml` is committed before
# the figure: a denominator chosen after seeing the numerator is not a denominator. It is also my own
# judgement about my own tools, which is the same authorship caveat the corpus carries — the honest
# use of this table is to find the tools nobody reaches for, not to grade the ones that get reached.
#
# One domain per tool, chosen as the problem the tool serves rather than the mechanism it uses.
# `iris_table_info` is `sql` and not `introspection` because a task reaches for it when the question is
# about a table.
#
# `baseline` is every corpus task's floor: each one edits or writes an ObjectScript class, runs code to
# see what it did, and needs to read a class it did not write. That is the widest honest floor — it
# means an unreached `iris_symbols` is reported as a tool the agent passed over rather than a tool no
# task needed, which is the harder answer and the one worth having.
#
# A task naming a skill also touches `skills`: the point of the per-skill rung is that the document is
# reachable, and the skill tools are how an agent finds it.

baseline = ["objectscript-code", "execution", "introspection"]

[tools]
agent_history = "agent-audit"
agent_stats = "agent-audit"
capability_matrix = "access"
