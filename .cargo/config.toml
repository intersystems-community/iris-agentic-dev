[build]
# No `rustc-wrapper` key here, deliberately. Both values this repo has tried break something:
#
#   ""             cargo reads an empty wrapper as "no wrapper", but cargo-llvm-cov reads the
#                  key itself and does not apply that special case — it built `" " + rustc` and
#                  every invocation died with `could not execute process ` …/rustc --print cfg`
#                  (never executed)`. The coverage gate was unrunnable from a720d2f on.
#   /usr/bin/env   a real passthrough on macOS and Linux, and a path that does not exist on
#                  Windows. `cargo build --locked` failed outright on windows-latest.
#
# So the passthrough that cargo-llvm-cov needs lives in scripts/coverage.sh and
# scripts/check-coverage-floors.sh, which are bash and only ever run on macOS or Linux. A
# committed cargo config has to build on every platform the project ships to, and turning off a
# tool the global ~/.cargo/config.toml turns on is not worth breaking one of them for. To keep
# sccache out of an ordinary local build: export CARGO_BUILD_RUSTC_WRAPPER=/usr/bin/env.
#
# Disable incremental compilation — mod.rs is a monolith so incremental rarely reuses
# artifacts, just accumulates stale cache that triggers full rebuilds on next run.
incremental = false

# There used to be a `[test] test-threads = 1` stanza here with a comment claiming it controlled
# cargo-level parallelism across test binaries. Cargo has no `[test]` table, so the key was inert
# and there was never any cargo-level parallelism to control: cargo runs test binaries strictly one
# after another and offers no knob to change that. RUST_TEST_THREADS below was doing the whole job
# on its own.
#
# That sequencing is why the test files are aggregated into four targets per crate instead of one
# target per file — see crates/iris-agentic-dev-core/tests/unit/main.rs. The per-binary spawn was
# ~85% of a warm run.
[env]
# Serializes tests within each binary. It matters more now than it did with one target per file:
# the integration and misc aggregates put many files in one process, so a test that calls
# `set_var` is visible to the next one.
#
# The `unit` target touches no IRIS and no shared env, and runs 2,319 tests in 5.7s parallel
# against 18.6s serial:
#
#   RUST_TEST_THREADS=12 cargo test --features testing --test unit
#
# Do not do that for `integration` — those tests need a live container and must stay serial.
RUST_TEST_THREADS = "1"
